[project]
name = "geom180to360"
readme = "README.md"
description = "Conversion tool of geometries from longitudes [-180, 180] to [0, 360]"
authors = [{name="Jean-Christophe MALAPERT", email="jean-christophe.malapert@cnes.fr"}, ]
license = "Apache-2.0"
packages = [{include = "geom180to360"}]
homepage = "https://gitlab.cnes.fr/pdssp/common/geom180to360"
version = "1.0.1"
# Python 3.15 triggers a source build of brotli (via matplotlib/fonttools) which fails as on CI as gcc is not available
requires-python = ">=3.12,<3.15"
dependencies = [
    "loguru==0.7.3",
    "numpy>=1.24",
    "shapely>=2.1",
]
[project.scripts]
geom180to360 = "geom180to360.__main__:run"

# ── Build ────────────────────────────────────────────────────────────────────
[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.hatch.build.targets.wheel]
packages = ["src/geom180to360"]

# ── Dev dependencies ─────────────────────────────────────────────────────────
[dependency-groups]
dev = [
    "matplotlib>=3.7",
    "pytest>=8",
    "ruff>=0.6",
    "dockerfile-parse>=2.0.1",
    "bump-my-version>=1.2.4",
    "coverage>=7.12.0",
    "mkdocs>=1.6.1",
    "mkdocs-gen-files>=0.6.0",
    "mkdocs-literate-nav>=0.6.2",
    "mkdocs-macros-plugin>=1.5.0",
    "mkdocs-material>=9.7.0",
    "mkdocs-with-pdf>=0.9.3",
    "mkdocstrings[python]>=1.0.0",
    "pip-licenses>=5.5.0",
    "pre-commit>=4.5.0",
    "pre-commit-hooks>=6.0.0",
    "pytest>=9.0.1",
    "pytest-html>=4.1.1",
    "pytest-json-report>=1.5.0",
    "pytest-profiling>=1.8.1",
    "docker>=7.1.0",
    "pytest-mock>=3.15.1",
    "black>=25.11.0",
    "tox>=4.32.0",
    "flake8>=7.3.0",
    "mccabe>=0.7.0",
    "mypy>=1.19.0",
    "pylint>=4.0.4",
    "toml>=0.10.2",
]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
pythonpath = ["tests"]
addopts = ["-ra", "--strict-markers", "--import-mode=importlib", "--doctest-modules"]
markers = [
    "plot: visualisation tests (require matplotlib)",
]

[tool.black]
line-length = 88
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | docs
  | scripts
  | docker
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.bandit]
exclude_dirs = [".venv", "tests", "scripts"]
